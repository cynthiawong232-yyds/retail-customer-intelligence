[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rci"
version = "0.1.0"
description = "Retail Customer Intelligence: segmentation, CLV, repurchase, and recommendations on UCI Online Retail II"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
